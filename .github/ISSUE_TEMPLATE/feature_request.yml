name: 功能建议
description: 提议一个范围明确的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请描述当前工作流中的具体困难，而不只是描述方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该功能适用于轻量 Windows 微信读书窗口的核心用途。
          required: true
        - label: 我已搜索现有 Issue，确认没有重复建议。
          required: true
