name: Bug 报告
description: 报告可以稳定复现的程序问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿上传 Cookie、登录二维码、个人书架截图或 `%LOCALAPPDATA%\WeReadStealth` 中的文件。

  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 2.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true

  - type: input
    id: webview2
    attributes:
      label: WebView2 Runtime 版本
      description: 可在“设置 > 应用 > 已安装的应用”中查看。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动程序
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 我确认附件不包含账号凭据、Cookie、登录二维码或个人数据。
          required: true
