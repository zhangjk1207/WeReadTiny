name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore WeReadStealth.sln --locked-mode

      - name: Build
        run: dotnet build WeReadStealth.sln -c Release --no-restore

      - name: Run tests
        run: dotnet run --project tests/WeReadStealth.Tests/WeReadStealth.Tests.csproj -c Release --no-build

      - name: Build portable package
        shell: powershell
        run: ./build.ps1

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: WeReadStealth-win-x64
          path: publish/WeReadStealth.zip
          if-no-files-found: error
          retention-days: 14
